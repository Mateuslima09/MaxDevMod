name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install JS dependencies
        run: npm ci

      - name: Build in-game telemetry & D3D11 plugin (westplay.dll)
        run: cargo build --release -p westplay-plugin

      - name: Build MaxDevMod NSIS installer
        run: npm run build:release

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaxDevMod-windows-x64-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
